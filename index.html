<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Materas de Cemento | Rocks & Roots</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #f4f0eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 10px;
    }
    
    .catalog-title {
      color: #2b2b2b;
      font-size: 1.4rem;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 600;
    }

    .zoom-hint {
      color: #666666;
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px;
      margin-bottom: 20px;
    }

    #flipbook {
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .page {
      background-color: #ffffff;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .index-link {
      position: absolute;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn {
      background: #2e5a44;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.25);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #234534;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .catalog-title {
        font-size: 1.2rem;
      }
      .btn {
        padding: 10px 22px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <h1 class="catalog-title">Catálogo Materas de Cemento</h1>
  <p class="zoom-hint">🔍 Haz doble clic / doble toque para abrir la imagen en alta calidad</p>

  <div class="flipbook-container">
    <div id="flipbook">
      
      <div class="page"><img src="PAGINA-01.png" alt="Portada" class="zoomable"></div>
      
      <div class="page">
        <img src="PAGINA-02.png" alt="Índice" class="zoomable">
        <div class="index-link" style="top: 30%; left: 10%; width: 80%; height: 8%;" data-page="2" title="Ir a Materas Acanaladas"></div>
        <div class="index-link" style="top: 40%; left: 10%; width: 80%; height: 8%;" data-page="4" title="Ir a Materas Lisas"></div>
        <div class="index-link" style="top: 50%; left: 10%; width: 80%; height: 8%;" data-page="6" title="Ir a Bases y Platos"></div>
      </div>

      <div class="page"><img src="PAGINA-03.png" alt="Página 3" class="zoomable"></div>
      <div class="page"><img src="PAGINA-04.png" alt="Página 4" class="zoomable"></div>
      <div class="page"><img src="PAGINA-05.png" alt="Página 5" class="zoomable"></div>
      <div class="page"><img src="PAGINA-06.png" alt="Página 6" class="zoomable"></div>
      <div class="page"><img src="PAGINA-07.png" alt="Página 7" class="zoomable"></div>
      <div class="page"><img src="PAGINA-08.png" alt="Página 8" class="zoomable"></div>
      <div class="page"><img src="PAGINA-09.png" alt="Página 9" class="zoomable"></div>
      <div class="page"><img src="PAGINA-10.png" alt="Página 10" class="zoomable"></div>
      <div class="page"><img src="PAGINA-11.png" alt="Contraportada" class="zoomable"></div>
      
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;
      const flipbookElem = document.getElementById('flipbook');

      const pageFlip = new St.PageFlip(flipbookElem, {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,
        usePortrait: true,
        singlePageMode: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

      // Clics del índice
      document.querySelectorAll('.index-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPage = parseInt(link.getAttribute('data-page'));
          pageFlip.flip(targetPage);
        });
      });

      // LÓGICA DE ABRIR EN NUEVA PESTAÑA CON DOBLE CLIC / DOBLE TAP
      let lastTap = 0;

      function openImageInNewTab(imgSrc) {
        window.open(imgSrc, '_blank');
      }

      // Doble Clic (PC)
      flipbookElem.addEventListener('dblclick', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          e.stopPropagation();
          openImageInNewTab(e.target.src);
        }
      });

      // Doble Tap (Móvil)
      flipbookElem.addEventListener('touchend', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            e.stopPropagation();
            openImageInNewTab(e.target.src);
          }
          lastTap = currentTime;
        }
      });
    });
  </script>
</body>
</html>
