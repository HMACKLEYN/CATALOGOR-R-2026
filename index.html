<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Materas de Cemento | Rocks & Roots</title>
  
  <!-- CSS para Zoom -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.6/dist/style.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #f4f0eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 10px;
    }
    
    .catalog-title {
      color: #2b2b2b;
      font-size: 1.4rem;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .zoom-hint {
      color: #666666;
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px;
      margin-bottom: 20px;
    }

    #flipbook {
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    .page {
      background-color: #ffffff;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }

    /* Recuadros del índice interactivo */
    .index-link {
      position: absolute;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* Botones principales (Anterior / Siguiente) */
    .btn {
      background: #2e5a44;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.25);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #234534;
      transform: translateY(-2px);
    }

    /* Botón secundario para Pantalla Completa */
    .btn-fullscreen {
      background: #ffffff;
      color: #2e5a44;
      border: 1.5px solid #2e5a44;
      padding: 11px 16px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-fullscreen:hover {
      background: #2e5a44;
      color: #ffffff;
    }

    /* Zoom modal overlays */
    .medium-zoom-overlay {
      background-color: rgba(0, 0, 0, 0.88) !important;
      z-index: 9999;
    }

    .medium-zoom-image--opened {
      z-index: 10000;
      cursor: zoom-out !important;
    }

    .disabled-flipbook {
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .catalog-title {
        font-size: 1.2rem;
      }
      .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
      .btn-fullscreen {
        padding: 9px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <h1 class="catalog-title">Catálogo Materas de Cemento</h1>
  <p class="zoom-hint">🔍 Toca o haz clic en la imagen para ampliar</p>

  <div class="flipbook-container">
    <div id="flipbook">
      
      <!-- Portada -->
      <div class="page"><img src="PAGINA-01.png" alt="Portada" class="zoomable"></div>
      
      <!-- Índice Interactivo -->
      <div class="page">
        <img src="PAGINA-02.png" alt="Índice" class="zoomable">
        <div class="index-link" style="top: 30%; left: 10%; width: 80%; height: 8%;" data-page="2" title="Ir a Materas Acanaladas"></div>
        <div class="index-link" style="top: 40%; left: 10%; width: 80%; height: 8%;" data-page="4" title="Ir a Materas Lisas"></div>
        <div class="index-link" style="top: 50%; left: 10%; width: 80%; height: 8%;" data-page="6" title="Ir a Bases y Platos"></div>
      </div>

      <!-- Páginas -->
      <div class="page"><img src="PAGINA-03.png" alt="Página 3" class="zoomable"></div>
      <div class="page"><img src="PAGINA-04.png" alt="Página 4" class="zoomable"></div>
      <div class="page"><img src="PAGINA-05.png" alt="Página 5" class="zoomable"></div>
      <div class="page"><img src="PAGINA-06.png" alt="Página 6" class="zoomable"></div>
      <div class="page"><img src="PAGINA-07.png" alt="Página 7" class="zoomable"></div>
      <div class="page"><img src="PAGINA-08.png" alt="Página 8" class="zoomable"></div>
      <div class="page"><img src="PAGINA-09.png" alt="Página 9" class="zoomable"></div>
      <div class="page"><img src="PAGINA-10.png" alt="Página 10" class="zoomable"></div>
      <div class="page"><img src="PAGINA-11.png" alt="Contraportada" class="zoomable"></div>
      
    </div>
  </div>

  <!-- Botones de Navegación + Pantalla Completa -->
  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn-fullscreen" id="fullscreen-btn" title="Pantalla completa">⛶ Pantalla Completa</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.6/dist/medium-zoom.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;
      const flipbookElem = document.getElementById('flipbook');

      const pageFlip = new St.PageFlip(flipbookElem, {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,
        usePortrait: true,
        singlePageMode: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

      // LÓGICA DE PANTALLA COMPLETA
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error al intentar activar pantalla completa: ${err.message}`);
          });
          fullscreenBtn.textContent = '✕ Salir';
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
            fullscreenBtn.textContent = '⛶ Pantalla Completa';
          }
        }
      });

      // Evento para actualizar texto del botón si el usuario sale con la tecla ESC
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          fullscreenBtn.textContent = '⛶ Pantalla Completa';
        }
      });

      // Clics del índice
      document.querySelectorAll('.index-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPage = parseInt(link.getAttribute('data-page'));
          pageFlip.flip(targetPage);
        });
      });

      // Zoom aislado
      const zoom = mediumZoom('.zoomable', {
        margin: 16,
        background: 'rgba(0, 0, 0, 0.88)',
        scrollOffset: 0
      });

      zoom.on('open', () => {
        flipbookElem.classList.add('disabled-flipbook');
      });

      zoom.on('closed', () => {
        flipbookElem.classList.remove('disabled-flipbook');
      });
    });
  </script>
</body>
</html>
