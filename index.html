  <style>
    /* =========================================================
       PALETA NEUTRA PREMIUM: ARCHITECTURE & BOTANICAL LIFESTYLE
       ========================================================= */
    :root {
      --bg-base: #F7F6F4;       /* Tono lino / concreto ultra claro */
      --bg-gradient-2: #F0EEEA;  /* Gradiente neutro suave */
      --bg-gradient-3: #EBE8E3;
      
      --brand-green: #2e5a44;    /* Verde salvia corporativo */
      --brand-green-hover: #234534;
      --accent-terracota: #D9825B; /* Tono terracota acento */
      --text-dark: #2B2B2B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(135deg, var(--bg-base), var(--bg-gradient-2), var(--bg-gradient-3));
      background-size: 300% 300%;
      animation: gradientBG 22s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding-top: 100px; /* Espacio superior para compensar el header fijo */
      padding-bottom: 20px;
      position: relative;
      overflow-x: hidden;
      color: var(--text-dark);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* TEXTURA VEGETAL DE FONDO CON FILTER SOFISTICADO */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('HOJAS.png');
      background-repeat: no-repeat;
      background-position: top right;
      background-size: contain;
      pointer-events: none;
      z-index: 0;
      opacity: 0.07;
      filter: blur(6px);
    }

    .main-header, .header-editorial, .zoom-hint, .flipbook-container, .controls, .main-footer, .modal-overlay {
      position: relative;
      z-index: 1;
    }

    /* ================= HEADER FIJO SUPERIOR ================= */
    .main-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 40px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .header-left { display: flex; justify-content: flex-start; }
    .header-center { display: flex; justify-content: center; }
    .header-right { display: flex; justify-content: flex-end; align-items: center; }

    .logo-header-img { height: 40px; width: auto; object-fit: contain; }

    .btn-cotizar {
      background: var(--brand-green);
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.15);
    }

    .btn-cotizar:hover {
      background: var(--brand-green-hover);
      transform: translateY(-1px);
    }

    /* MENÚ DESPLEGABLE DE NAVEGACIÓN */
    .nav-menu { position: relative; }
    
    .menu-btn {
      background: transparent;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--brand-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      letter-spacing: 0.5px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: #ffffff;
      min-width: 200px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.05);
      z-index: 110;
    }

    .dropdown-content a {
      color: var(--text-dark);
      padding: 12px 18px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: var(--bg-gradient-2);
      color: var(--brand-green);
    }

    .nav-menu:hover .dropdown-content { display: block; }

    /* ================= ENCABEZADO EDITORIAL DE MARCA ================= */

      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .season-badge {

      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 30px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);

    .catalog-title-container {

      justify-content: center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.04));

      height: auto;
      object-fit: contain;
      display: block;
    }

    .title-subline {

      font-size: 0.78rem;
      letter-spacing: 4px;
      color: #666666;
      text-transform: uppercase;
      margin-top: 2px;

    .zoom-hint {
      color: #777777;
      font-size: 0.78rem;
      margin-bottom: 18px;
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ================= FLIPBOOK CONTAINER ================= */
    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px;
      margin-bottom: 22px;
    }

    #flipbook {
      box-shadow: 0 20px 48px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.04);
      border-radius: 8px;
      overflow: hidden;
      touch-action: pan-y;
      background-color: #ffffff;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .page {

      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .index-link {
      position: absolute;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    /* CONTROLES DE NAVEGACIÓN */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 24px;
    }

    .btn {
      background: var(--brand-green);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;

      display: flex;
      align-items: center;
      gap: 8px;

    .btn:hover {
      background: var(--brand-green-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(46, 90, 68, 0.3);
    }

    /* ================= MODAL FORMULARIO DE COTIZACIÓN ================= */

      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(5px);
      z-index: 200;
      justify-content: center;
      align-items: center;

    .modal-content {

      width: 100%;

      box-shadow: 0 15px 35px rgba(0,0,0,0.18);

    .modal-close {

      font-size: 1.5rem;
      cursor: pointer;

    .form-group input, .form-group textarea {

      letter-spacing: 0.5px;
      cursor: pointer;

      border: 1px solid rgba(0, 0, 0, 0.05);

      color: #ffffff;

      box-shadow: 0 6px 16px rgba(46, 90, 68, 0.25);

    /* BOTÓN FLOTANTE DE WHATSAPP */

      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 54px;
      height: 54px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.7rem;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
      z-index: 99;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: whatsappBounce 5s infinite ease-in-out;
    }

    .whatsapp-btn:hover {
      animation-play-state: paused;
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.5);
      color: #ffffff;
    }

    @keyframes whatsappBounce {
      0%, 20%, 100% { transform: translateY(0) scale(1); }
      5% { transform: translateY(-10px) scale(1.03); }
      10% { transform: translateY(0) scale(0.98); }
      15% { transform: translateY(-5px) scale(1.01); }
    }

    @media (max-width: 600px) {
      .main-header { padding: 0 15px; height: 65px; }
      body { padding-top: 85px; }
      .logo-header-img { height: 32px; }
      .btn-cotizar { padding: 7px 14px; font-size: 0.72rem; }
      .menu-btn { font-size: 0.8rem; padding: 6px 8px; }
      .catalog-title-container { max-width: 86vw; }
      .title-subline { font-size: 0.68rem; letter-spacing: 3px; }
      .bottom-image-container { max-width: 140px; }
      .btn { padding: 9px 20px; font-size: 0.82rem; }
      .whatsapp-btn { width: 48px; height: 48px; font-size: 1.5rem; bottom: 18px; right: 18px; }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    let pageFlip;

    document.addEventListener('DOMContentLoaded', function() {
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;
      const flipbookElem = document.getElementById('flipbook');

      pageFlip = new St.PageFlip(flipbookElem, {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,
        usePortrait: true,
        singlePageMode: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

      // ENLACES INTERNOS EN PÁGINAS INDICE
      document.querySelectorAll('.index-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPage = parseInt(link.getAttribute('data-page'));
          pageFlip.flip(targetPage);
        });
      });

      // EVENTOS DE ZOOM EN IMÁGENES
      let lastTap = 0;

      function openImageInNewTab(imgSrc) {
        window.open(imgSrc, '_blank');
      }

      flipbookElem.addEventListener('dblclick', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          e.stopPropagation();
          openImageInNewTab(e.target.src);
        }
      });

      flipbookElem.addEventListener('touchend', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            e.stopPropagation();
            openImageInNewTab(e.target.src);
          }
          lastTap = currentTime;
        }
      });

      // GESTIÓN DEL MODAL DE COTIZACIÓN
      const modal = document.getElementById('cotizarModal');
      document.getElementById('openModal').addEventListener('click', (e) => {
        e.preventDefault();
        modal.style.display = 'flex';
      });
      document.getElementById('closeModal').addEventListener('click', () => {
        modal.style.display = 'none';
      });
      window.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
      });
    });

    // FUNCIÓN DE PASO RÁPIDO ANIMADO PARA MENÚ DE COLECCIONES
    function goFastToPage(targetPageZeroBased) {
      if (!pageFlip) return;
      
      const currentPage = pageFlip.getCurrentPageIndex();
      const diff = Math.abs(targetPageZeroBased - currentPage);

      if (diff === 0) return;

      if (diff <= 2) {
        pageFlip.flip(targetPageZeroBased);
      } else {
        const step = targetPageZeroBased > currentPage ? 1 : -1;
        let tempPage = currentPage;

        const interval = setInterval(() => {
          tempPage += step;
          pageFlip.flip(tempPage);

          if (tempPage === targetPageZeroBased) {
            clearInterval(interval);
          }
        }, 110); // Velocidad de hojeo en milisegundos
      }
    }
  </script>
