<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Materas de Cemento | Rocks & Roots</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      /* EDITAR COLOR DE FONDO AQUÍ */
      background-color: #f4f0eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 0;
    }
    
    .catalog-title {
      color: #ffffff; /* Si usas fondo claro, cambia a #2b2b2b */
      font-size: 1.5rem;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 25px;
    }

    #flipbook {
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Evita que la imagen se corte */
      background-color: transparent;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
    }

    .btn {
      background: #3182ce;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Título principal -->
  <h1 class="catalog-title">Catálogo Materas de Cemento</h1>

  <!-- Contenedor del Flipbook con las 11 páginas -->
  <div class="flipbook-container">
    <div id="flipbook">
      <div class="page"><img src="PAGINA-01.png" alt="Portada"></div>
      <div class="page"><img src="PAGINA-02.png" alt="Página 2"></div>
      <div class="page"><img src="PAGINA-03.png" alt="Página 3"></div>
      <div class="page"><img src="PAGINA-04.png" alt="Página 4"></div>
      <div class="page"><img src="PAGINA-05.png" alt="Página 5"></div>
      <div class="page"><img src="PAGINA-06.png" alt="Página 6"></div>
      <div class="page"><img src="PAGINA-07.png" alt="Página 7"></div>
      <div class="page"><img src="PAGINA-08.png" alt="Página 8"></div>
      <div class="page"><img src="PAGINA-09.png" alt="Página 9"></div>
      <div class="page"><img src="PAGINA-10.png" alt="Página 10"></div>
      <div class="page"><img src="PAGINA-11.png" alt="Contraportada"></div>
    </div>
  </div>

  <!-- Botones de navegación (Aparecen abajo centrados) -->
  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <!-- Script de configuración -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
        width: 500, // Dimensión cuadrada para imágenes 1080x1080 px (1:1)
        height: 500,
        size: 'fixed',
        minWidth: 300,
        maxWidth: 700,
        minHeight: 300,
        maxHeight: 700,
        drawShadow: true,
        showCover: true,
        usePortrait: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());
    });
  </script>
</body>
</html>
