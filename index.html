<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Rocks & Roots Design</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1e24;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    .catalog-title {
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      text-align: center;
    }

    .flipbook-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn {
      background: #3182ce;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(49, 130, 206, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Ajustes para móviles */
    @media (max-width: 600px) {
      .catalog-title {
        font-size: 1.2rem;
      }
      .btn {
        padding: 10px 18px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <h1 class="catalog-title">Catálogo Interactivo</h1>

  <div class="flipbook-container">
    <div id="flipbook">
      <!-- 
        INSTRUCCIONES:
        Reemplaza 'pagina-1.jpg', 'pagina-2.jpg', etc., por los nombres exactos 
        de tus archivos de imagen subidos a la misma carpeta en GitHub.
      -->
      <div class="page"><img src="pagina-1.jpg" alt="Portada"></div>
      <div class="page"><img src="pagina-2.jpg" alt="Página 2"></div>
      <div class="page"><img src="pagina-3.jpg" alt="Página 3"></div>
      <div class="page"><img src="pagina-4.jpg" alt="Página 4"></div>
      <div class="page"><img src="pagina-5.jpg" alt="Página 5"></div>
      <div class="page"><img src="pagina-6.jpg" alt="Contraportada"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <!-- Librería StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pageFlip = new St.PageFlip(
        document.getElementById('flipbook'),
        {
          width: 400,          // Ancho base de cada hoja en px
          height: 550,         // Alto base de cada hoja en px
          size: 'fixed',
          minWidth: 280,
          maxWidth: 1000,
          minHeight: 380,
          maxHeight: 1400,
          drawShadow: true,    // Sombras tridimensionales al pasar hoja
          showCover: true,     // La primera hoja se muestra como portada individual
          usePortrait: true    // En celulares cambia automáticamente a 1 sola hoja
        }
      );

      // Cargar hojas del flipbook
      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      // Asignar eventos a los botones
      document.getElementById('prev').addEventListener('click', () => {
        pageFlip.flipPrev();
      });

      document.getElementById('next').addEventListener('click', () => {
        pageFlip.flipNext();
      });
    });
  </script>

</body>
</html>
