<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Materas de Cemento | Rocks & Roots</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- ETIQUETAS OPEN GRAPH -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo Materas de Cemento | Rocks & Roots">
  <meta property="og:description" content="Explora nuestro catálogo interactivo de materas de cemento y diseño botánico.">
  <meta property="og:image" content="https://hmackleyn.github.io/CATALOGOR-R-2026/BANNER.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <style>
    /* =========================================================
       CONFIGURACIÓN DE COLORES POR TEMPORADA
       ========================================================= */
    :root {
      /* Paleta: Amor y Amistad (Rojos y Rosas suaves) */
      --color-1: #fce4ec;
      --color-2: #f48fb1;
      --color-3: #e57373;
      --color-4: #f8bbd0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(-45deg, var(--color-1), var(--color-2), var(--color-3), var(--color-4));
      background-size: 400% 400%;
      animation: gradientBG 18s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 10px;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =========================================================
       IMAGEN PNG DE HOJAS CON BLUR PROYECTADA AL FONDO
       ========================================================= */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* Tu imagen PNG de hojas (Cámbialo por tu nombre de archivo exacto) */
      background-image: url('HOJAS.png');
      background-repeat: no-repeat;
      background-position: top right;
      background-size: contain; /* O 'cover' si quieres que ocupe toda la pantalla */
      pointer-events: none;
      z-index: 0;
      
      /* Ajustes visuales de intensidad y desenfoque */
      opacity: 0.15;            /* Transparencia para que se integre suavemente */
      filter: blur(8px);        /* Nivel de desenfoque en píxeles */
    }

    .catalog-title-container, .zoom-hint, .flipbook-container, .controls {
      position: relative;
      z-index: 1;
    }
    
    .catalog-title-container {
      width: 100%;
      max-width: 520px; 
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
    }

    .catalog-title-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .zoom-hint {
      color: #5c4b4e;
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px;
      margin-bottom: 20px;
    }

    #flipbook {
      box-shadow: 0 16px 38px rgba(0,0,0,0.12);
      border-radius: 8px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .page {
      background-color: #ffffff;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .index-link {
      position: absolute;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn {
      background: #2e5a44;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #234534;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .catalog-title-container {
        max-width: 90vw;
      }
      .btn {
        padding: 10px 22px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="catalog-title-container">
    <img src="TITULO-CATALOGO.png" alt="Catálogo Materas de Cemento 2026 - Rocks & Roots" class="catalog-title-img">
  </div>

  <p class="zoom-hint">🔍 Haz doble clic / doble toque para ver la imagen completa</p>

  <div class="flipbook-container">
    <div id="flipbook">
      
      <div class="page"><img src="PAGINA.jpg" alt="Portada" class="zoomable"></div>
      
      <div class="page">
        <img src="PAGINA2.jpg" alt="Página 2" class="zoomable">
        <div class="index-link" style="top: 30%; left: 10%; width: 80%; height: 8%;" data-page="2" title="Ir a Sección 1"></div>
        <div class="index-link" style="top: 40%; left: 10%; width: 80%; height: 8%;" data-page="4" title="Ir a Sección 2"></div>
      </div>

      <div class="page"><img src="PAGINA3.jpg" alt="Página 3" class="zoomable"></div>
      <div class="page"><img src="PAGINA4.jpg" alt="Página 4" class="zoomable"></div>
      <div class="page"><img src="PAGINA5.jpg" alt="Página 5" class="zoomable"></div>
      <div class="page"><img src="PAGINA6.jpg" alt="Página 6" class="zoomable"></div>
      <div class="page"><img src="PAGINA7.jpg" alt="Página 7" class="zoomable"></div>
      <div class="page"><img src="PAGINA8.jpg" alt="Página 8" class="zoomable"></div>
      <div class="page"><img src="PAGINA9.jpg" alt="Página 9" class="zoomable"></div>
      <div class="page"><img src="PAGINA10.jpg" alt="Página 10" class="zoomable"></div>
      <div class="page"><img src="PAGINA11.jpg" alt="Página 11" class="zoomable"></div>
      <div class="page"><img src="PAGINA12.jpg" alt="Página 12" class="zoomable"></div>
      <div class="page"><img src="PAGINA13.jpg" alt="Página 13" class="zoomable"></div>
      <div class="page"><img src="PAGINA14.jpg" alt="Página 14" class="zoomable"></div>
      <div class="page"><img src="PAGINA15.jpg" alt="Página 15" class="zoomable"></div>
      <div class="page"><img src="PAGINA16.jpg" alt="Página 16" class="zoomable"></div>
      <div class="page"><img src="PAGINA17.jpg" alt="Página 17" class="zoomable"></div>
      <div class="page"><img src="PAGINA18.jpg" alt="Página 18" class="zoomable"></div>
      <div class="page"><img src="PAGINA19.jpg" alt="Página 19" class="zoomable"></div>
      <div class="page"><img src="PAGINA20.jpg" alt="Página 20" class="zoomable"></div>
      <div class="page"><img src="PAGINA21.jpg" alt="Página 21" class="zoomable"></div>
      <div class="page"><img src="PAGINA22.jpg" alt="Página 22" class="zoomable"></div>
      <div class="page"><img src="PAGINA23.jpg" alt="Página 23" class="zoomable"></div>
      <div class="page"><img src="PAGINA24.jpg" alt="Página 24" class="zoomable"></div>
      <div class="page"><img src="PAGINA25.jpg" alt="Página 25" class="zoomable"></div>

      <div class="page"><img src="PAGINA27.jpg" alt="Página 27" class="zoomable"></div>

      <div class="page"><img src="PAGINA30.jpg" alt="Página 30" class="zoomable"></div>
      <div class="page"><img src="PAGINA31.jpg" alt="Página 31" class="zoomable"></div>
      
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;
      const flipbookElem = document.getElementById('flipbook');

      const pageFlip = new St.PageFlip(flipbookElem, {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,
        usePortrait: true,
        singlePageMode: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

      document.querySelectorAll('.index-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPage = parseInt(link.getAttribute('data-page'));
          pageFlip.flip(targetPage);
        });
      });

      let lastTap = 0;

      function openImageInNewTab(imgSrc) {
        window.open(imgSrc, '_blank');
      }

      flipbookElem.addEventListener('dblclick', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          e.stopPropagation();
          openImageInNewTab(e.target.src);
        }
      });

      flipbookElem.addEventListener('touchend', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            e.stopPropagation();
            openImageInNewTab(e.target.src);
          }
          lastTap = currentTime;
        }
      });
    });
  </script>
</body>
</html>
