<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Materas de Cemento | Rocks & Roots</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #f4f0eb; /* Fondo beige cálido */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 10px;
    }
    
    .catalog-title {
      color: #2b2b2b; /* Texto oscuro para contraste sobre fondo claro */
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px; /* Ancho máximo en pantallas grandes */
      margin-bottom: 20px;
    }

    #flipbook {
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    .page {
      background-color: #ffffff;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
    }

    /* Botones con estilo Verde Orgánico */
    .btn {
      background: #2e5a44; /* Verde elegante / botánico */
      color: #ffffff;
      border: none;
      padding: 12px 26px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.25);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #234534;
      transform: translateY(-2px);
    }

    /* Ajustes específicos para pantallas móviles */
    @media (max-width: 600px) {
      .catalog-title {
        font-size: 1.2rem;
        margin-bottom: 15px;
      }
      .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Título principal -->
  <h1 class="catalog-title">Catálogo Materas de Cemento</h1>

  <!-- Contenedor del Flipbook -->
  <div class="flipbook-container">
    <div id="flipbook">
      <div class="page"><img src="PAGINA-01.png" alt="Portada"></div>
      <div class="page"><img src="PAGINA-02.png" alt="Página 2"></div>
      <div class="page"><img src="PAGINA-03.png" alt="Página 3"></div>
      <div class="page"><img src="PAGINA-04.png" alt="Página 4"></div>
      <div class="page"><img src="PAGINA-05.png" alt="Página 5"></div>
      <div class="page"><img src="PAGINA-06.png" alt="Página 6"></div>
      <div class="page"><img src="PAGINA-07.png" alt="Página 7"></div>
      <div class="page"><img src="PAGINA-08.png" alt="Página 8"></div>
      <div class="page"><img src="PAGINA-09.png" alt="Página 9"></div>
      <div class="page"><img src="PAGINA-10.png" alt="Página 10"></div>
      <div class="page"><img src="PAGINA-11.png" alt="Contraportada"></div>
    </div>
  </div>

  <!-- Botones de navegación -->
  <div class="controls">
    <button class="btn" id="prev">❮ Anterior</button>
    <button class="btn" id="next">Siguiente ❯</button>
  </div>

  <!-- Script de configuración -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Cálculo responsivo del tamaño según la pantalla
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;

      const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,      /* Desactivado para mantener vista de 1 sola página siempre */
        usePortrait: true,     /* Fuerza el modo de 1 sola hoja */
        singlePageMode: true   /* Garantiza vista individual en móviles y desktop */
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());
    });
  </script>
</body>
</html>
