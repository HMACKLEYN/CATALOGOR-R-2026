  <style>
    /* =========================================================
       CONFIGURACIÓN DE COLORES POR TEMPORADA
       ========================================================= */
    :root {
      /* Paleta: Amor y Amistad (Rojos y Rosas suaves) */
      --color-1: #FFD6D1;
      --color-2: #FAE2E2;
      --color-3: #FFBFB0;
      --color-4: #FCDDD3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(-45deg, var(--color-1), var(--color-2), var(--color-3), var(--color-4));
      background-size: 400% 400%;
      animation: gradientBG 18s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 10px 40px 10px;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* IMAGEN DE FONDO (HOJAS CON BLUR) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('HOJAS.png');
      background-repeat: no-repeat;
      background-position: top right;
      background-size: contain;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      filter: blur(8px);
    }

    .catalog-title-container, .zoom-hint, .flipbook-container, .controls, .bottom-image-container, .social-links {
      position: relative;
      z-index: 1;
    }
    
    .catalog-title-container {
      width: 100%;
      max-width: 520px; 
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
    }

    .catalog-title-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .zoom-hint {
      color: #5c4b4e;
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .flipbook-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 550px;
      margin-bottom: 20px;
    }

    #flipbook {
      box-shadow: 0 16px 38px rgba(0,0,0,0.12);
      border-radius: 8px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .page {
      background-color: #ffffff;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .index-link {
      position: absolute;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 18px;
    }

    .btn {
      background: #2e5a44;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #234534;
      transform: translateY(-2px);
    }

    /* TAMAÑO DE LA IMAGEN INFERIOR */
    .bottom-image-container {
      width: 100%;
      max-width: 220px;
      display: flex;
      justify-content: center;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .bottom-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ESTILOS ICONOS REDES SOCIALES */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 5px;
    }

    .social-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #2e5a44;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    .social-icon:hover {
      background-color: #2e5a44;
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    /* =========================================================
       BOTÓN FLOTANTE WHATSAPP CON ANIMACIÓN CADA 5 SEGUNDOS
       ========================================================= */
    .whatsapp-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 58px;
      height: 58px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.9rem;
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
      z-index: 99;
      text-decoration: none;
      transition: background-color 0.3s ease;
      animation: whatsappBounce 5s infinite ease-in-out;
    }

    .whatsapp-btn:hover {
      animation-play-state: paused; /* Pausa el rebote al pasar el mouse sobre él */
      transform: scale(1.1);
      box-shadow: 0 8px 22px rgba(37, 211, 102, 0.6);
      color: #ffffff;
    }

    /* Keyframes para el rebote dinámico cada 5 segundos */
    @keyframes whatsappBounce {
      0%, 20%, 100% {
        transform: translateY(0) scale(1);
      }
      5% {
        transform: translateY(-14px) scale(1.05);
      }
      10% {
        transform: translateY(0) scale(0.98);
      }
      15% {
        transform: translateY(-7px) scale(1.02);
      }
    }

    @media (max-width: 600px) {
      .catalog-title-container {
        max-width: 90vw;
      }
      .bottom-image-container {
        max-width: 180px;
      }
      .btn {
        padding: 10px 22px;
        font-size: 0.9rem;
      }
      .whatsapp-btn {
        width: 52px;
        height: 52px;
        font-size: 1.7rem;
        bottom: 18px;
        right: 18px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const screenWidth = window.innerWidth;
      const initialSize = screenWidth < 550 ? Math.min(screenWidth - 40, 480) : 500;
      const flipbookElem = document.getElementById('flipbook');

      const pageFlip = new St.PageFlip(flipbookElem, {
        width: initialSize,
        height: initialSize,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 280,
        maxHeight: 600,
        drawShadow: true,
        showCover: false,
        usePortrait: true,
        singlePageMode: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

      document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

      document.querySelectorAll('.index-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPage = parseInt(link.getAttribute('data-page'));
          pageFlip.flip(targetPage);
        });
      });

      let lastTap = 0;

      function openImageInNewTab(imgSrc) {
        window.open(imgSrc, '_blank');
      }

      flipbookElem.addEventListener('dblclick', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          e.stopPropagation();
          openImageInNewTab(e.target.src);
        }
      });

      flipbookElem.addEventListener('touchend', (e) => {
        if (e.target.tagName === 'IMG' && e.target.classList.contains('zoomable')) {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            e.stopPropagation();
            openImageInNewTab(e.target.src);
          }
          lastTap = currentTime;
        }
      });
    });
  </script>
